<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>B-System 리포트</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:        #0a0c10;
      --surface:   #111418;
      --border:    #1e2328;
      --accent:    #e8b84b;
      --accent2:   #4b9ee8;
      --danger:    #e85c4b;
      --success:   #4be87a;
      --text:      #c9d1d9;
      --text-dim:  #6e7681;
      --font-body: 'Noto Sans KR', sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-body);
      min-height: 100vh;
      padding: 0 0 60px;
    }

    /* 헤더 */
    header {
      border-bottom: 1px solid var(--border);
      padding: 20px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      background: var(--bg);
      z-index: 10;
    }
    .logo {
      font-family: var(--font-mono);
      font-size: 13px;
      color: var(--accent);
      letter-spacing: 2px;
    }
    .logo span { color: var(--text-dim); }
    .status-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--success);
      display: inline-block;
      margin-right: 8px;
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%,100% { opacity: 1; }
      50%      { opacity: 0.3; }
    }

    /* 메인 레이아웃 */
    .container { max-width: 860px; margin: 0 auto; padding: 32px 24px; }

    /* 최신 리포트 카드 */
    .latest-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 28px;
      margin-bottom: 32px;
      position: relative;
      overflow: hidden;
    }
    .latest-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 2px;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
    }
    .card-meta {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }
    .badge {
      font-family: var(--font-mono);
      font-size: 11px;
      padding: 4px 10px;
      border-radius: 4px;
      letter-spacing: 1px;
    }
    .badge-date  { background: #1e2328; color: var(--accent); }
    .badge-session { background: #1a2030; color: var(--accent2); }
    .severity-bar {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
    }
    .severity-label {
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--text-dim);
      width: 80px;
    }
    .bar-wrap {
      flex: 1;
      height: 6px;
      background: var(--border);
      border-radius: 3px;
      overflow: hidden;
    }
    .bar-fill {
      height: 100%;
      border-radius: 3px;
      transition: width 0.8s ease;
    }
    .severity-val {
      font-family: var(--font-mono);
      font-size: 13px;
      font-weight: 600;
      width: 40px;
      text-align: right;
    }
    .regime-tag {
      display: inline-block;
      padding: 6px 14px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 500;
      margin-bottom: 20px;
    }
    .full-report {
      font-size: 14px;
      line-height: 1.8;
      color: var(--text);
      white-space: pre-wrap;
      word-break: break-word;
    }
    .full-report b { color: var(--accent); font-weight: 600; }

    /* 뉴스 링크 */
    .news-section {
      margin-top: 24px;
      padding-top: 20px;
      border-top: 1px solid var(--border);
    }
    .news-title {
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--text-dim);
      letter-spacing: 2px;
      margin-bottom: 12px;
    }
    .news-section a {
      display: block;
      color: var(--accent2);
      font-size: 13px;
      text-decoration: none;
      padding: 6px 0;
      border-bottom: 1px solid var(--border);
      transition: color 0.2s;
    }
    .news-section a:hover { color: var(--accent); }

    /* 히스토리 */
    .section-title {
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--text-dim);
      letter-spacing: 2px;
      margin-bottom: 16px;
    }
    .history-list { display: flex; flex-direction: column; gap: 8px; }
    .history-item {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 14px 18px;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .history-item:hover  { border-color: var(--accent); background: #15181e; }
    .history-item.active { border-color: var(--accent); }
    .h-date {
      font-family: var(--font-mono);
      font-size: 12px;
      color: var(--accent);
      min-width: 90px;
    }
    .h-session { font-size: 11px; color: var(--text-dim); min-width: 40px; }
    .h-severity { font-family: var(--font-mono); font-size: 12px; min-width: 50px; }
    .h-regime { font-size: 12px; color: var(--text-dim); flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .h-arrow { color: var(--text-dim); font-size: 12px; }

    /* 상세 패널 */
    .detail-panel {
      background: var(--surface);
      border: 1px solid var(--accent);
      border-radius: 12px;
      padding: 24px;
      margin-top: 8px;
      margin-bottom: 16px;
      display: none;
    }
    .detail-panel.open { display: block; }
    .detail-panel .full-report { font-size: 13px; }

    /* 로딩 */
    .loading {
      text-align: center;
      padding: 60px;
      font-family: var(--font-mono);
      color: var(--text-dim);
      font-size: 13px;
    }
    .loading::after {
      content: '';
      display: inline-block;
      width: 20px;
      height: 20px;
      border: 2px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-left: 10px;
      vertical-align: middle;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .error { text-align: center; padding: 40px; color: var(--danger); font-family: var(--font-mono); font-size: 13px; }

    /* 반응형 */
    @media (max-width: 600px) {
      .history-item { flex-wrap: wrap; }
      .h-regime { display: none; }
    }
  </style>
</head>
<body>

<header>
  <div class="logo">
    <span class="status-dot"></span>
    B<span>-</span>SYSTEM <span>// REPORT</span>
  </div>
  <div class="logo" style="font-size:11px; color: var(--text-dim);">
    sdhkor.github.io/b-system
  </div>
</header>

<div class="container">
  <div id="app"><div class="loading">데이터 로딩 중</div></div>
</div>

<script>
  const BIN_ID     = "69cde53936566621a86fc279";
  const MASTER_KEY = "$2a$10$jcmkgZGtfelLc6vkV7LIi.2Nkb4ajPFwEHs6hK6Wcq0zkoRBfxsVm"; // ← JSONBin X-Access-Key (읽기전용) 입력

  // 심각도에 따른 색상
  function severityColor(s) {
    const v = parseFloat(s);
    if (v >= 8) return "#e85c4b";
    if (v >= 6) return "#e8a84b";
    if (v >= 4) return "#e8e84b";
    return "#4be87a";
  }

  // 레짐 태그 색상
  function regimeStyle(regime) {
    const r = (regime || "").toLowerCase();
    if (r.includes("crisis") || r.includes("위기"))
      return "background:#2a1515; color:#e85c4b; border:1px solid #e85c4b33";
    if (r.includes("risk-off") || r.includes("불안정"))
      return "background:#2a1f10; color:#e8a84b; border:1px solid #e8a84b33";
    if (r.includes("transition") || r.includes("전환"))
      return "background:#1a1a2a; color:#9b8ee8; border:1px solid #9b8ee833";
    return "background:#102a15; color:#4be87a; border:1px solid #4be87a33";
  }

  // HTML 파싱 (b 태그 허용)
  function parseHtml(text) {
    return (text || "").replace(/\n/g, "<br>");
  }

  // 날짜 포맷
  function fmtDate(d) {
    if (!d) return "";
    return d.replace(/(\d{4})-(\d{2})-(\d{2})/, "$1.$2.$3");
  }

  // 리포트 카드 렌더링
  function renderLatest(r) {
    const sColor = severityColor(r.severity);
    const pct    = Math.min(parseFloat(r.severity) * 10, 100);
    return `
      <div class="latest-card">
        <div class="card-meta">
          <span class="badge badge-date">${fmtDate(r.date)}</span>
          <span class="badge badge-session">${r.session || ""}</span>
          <span style="font-family:var(--font-mono);font-size:11px;color:var(--text-dim)">
            ${r.savedAt ? "저장: " + r.savedAt : ""}
          </span>
        </div>
        <div class="severity-bar">
          <span class="severity-label">SEVERITY</span>
          <div class="bar-wrap">
            <div class="bar-fill" style="width:${pct}%;background:${sColor}"></div>
          </div>
          <span class="severity-val" style="color:${sColor}">${r.severity}/10</span>
        </div>
        <div class="regime-tag" style="${regimeStyle(r.regime)}">${r.regime || "레짐 분석 중"}</div>
        <div class="full-report">${parseHtml(r.full)}</div>
        ${r.news ? `
        <div class="news-section">
          <div class="news-title">📡 포착된 주요 기미</div>
          ${r.news}
        </div>` : ""}
      </div>`;
  }

  // 히스토리 아이템
  function renderHistory(reports) {
    if (reports.length <= 1) return "";
    const items = reports.slice(1).map((r, i) => `
      <div class="history-item" onclick="toggleDetail(${i+1})" id="h-${i+1}">
        <span class="h-date">${fmtDate(r.date)}</span>
        <span class="h-session">${r.session || ""}</span>
        <span class="h-severity" style="color:${severityColor(r.severity)}">${r.severity}/10</span>
        <span class="h-regime">${r.regime || ""}</span>
        <span class="h-arrow">›</span>
      </div>
      <div class="detail-panel" id="dp-${i+1}">
        <div class="severity-bar" style="margin-bottom:16px">
          <span class="severity-label">SEVERITY</span>
          <div class="bar-wrap">
            <div class="bar-fill" style="width:${Math.min(parseFloat(r.severity)*10,100)}%;background:${severityColor(r.severity)}"></div>
          </div>
          <span class="severity-val" style="color:${severityColor(r.severity)}">${r.severity}/10</span>
        </div>
        <div class="regime-tag" style="${regimeStyle(r.regime)}">${r.regime || ""}</div>
        <div class="full-report">${parseHtml(r.full)}</div>
        ${r.news ? `<div class="news-section"><div class="news-title">📡 포착된 주요 기미</div>${r.news}</div>` : ""}
      </div>
    `).join("");

    return `
      <div class="section-title" style="margin-top:8px">HISTORY // 이전 리포트</div>
      <div class="history-list">${items}</div>`;
  }

  function toggleDetail(idx) {
    const panel = document.getElementById(`dp-${idx}`);
    const item  = document.getElementById(`h-${idx}`);
    const isOpen = panel.classList.contains("open");
    // 전체 닫기
    document.querySelectorAll(".detail-panel").forEach(p => p.classList.remove("open"));
    document.querySelectorAll(".history-item").forEach(i => i.classList.remove("active"));
    if (!isOpen) {
      panel.classList.add("open");
      item.classList.add("active");
      panel.scrollIntoView({ behavior: "smooth", block: "nearest" });
    }
  }

  // 메인 로드
  async function loadReports() {
    const app = document.getElementById("app");
    try {
      const res  = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
        headers: MASTER_KEY ? { "X-Master-Key": MASTER_KEY } : {}
      });
      const data = await res.json();
      const reports = (data.record && data.record.reports) || [];

      if (reports.length === 0) {
        app.innerHTML = `<div class="error">아직 리포트가 없습니다.<br>Apps Script를 실행하면 데이터가 쌓입니다.</div>`;
        return;
      }

      app.innerHTML =
        renderLatest(reports[0]) +
        renderHistory(reports);

    } catch (e) {
      app.innerHTML = `<div class="error">데이터 로드 실패<br>${e.message}</div>`;
    }
  }

  // URL 파라미터로 특정 날짜 자동 하이라이트 (텔레그램 링크 클릭 시)
  function highlightFromUrl() {
    const params = new URLSearchParams(window.location.search);
    const dateParam = params.get("date"); // 예: 20260402
    if (!dateParam) return;
    const formatted = dateParam.replace(/(\d{4})(\d{2})(\d{2})/, "$1-$2-$3");
    setTimeout(() => {
      const items = document.querySelectorAll(".h-date");
      items.forEach((el, i) => {
        if (el.textContent.includes(formatted.replace(/-/g, "."))) {
          toggleDetail(i + 1);
        }
      });
    }, 500);
  }

  loadReports().then(highlightFromUrl);
</script>
</body>
</html>
